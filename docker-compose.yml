services:
  coihong:
    build:
      context: .
    image: coihong
    restart: unless-stopped

    ports:
      - '3000:3000'

    environment:
      API_BASE: ${API_BASE:-https://phimapi.com}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      PORT: '3000'

    init: true

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
